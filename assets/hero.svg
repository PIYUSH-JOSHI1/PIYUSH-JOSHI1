<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f7aa02"/><stop offset="1" stop-color="#ff6b4a"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f7aa02" stop-opacity=".35"/><stop offset="1" stop-color="#f7aa02" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#34363c" stroke-width="1"/></pattern>
</defs>
<rect width="900" height="320" rx="18" fill="#1b1c1f"/>
<rect width="900" height="320" rx="18" fill="url(#grid)" opacity=".5"/>
<circle cx="700" cy="160" r="170" fill="url(#glow)"><animate attributeName="r" values="150;185;150" dur="5s" repeatCount="indefinite"/></circle>

<!-- 3D orbit system -->
<g transform="translate(700 160)">
  <ellipse rx="130" ry="42" fill="none" stroke="#f7aa02" stroke-opacity=".5" stroke-dasharray="6 8" transform="rotate(-20)"/>
  <ellipse rx="130" ry="42" fill="none" stroke="#ff6b4a" stroke-opacity=".4" stroke-dasharray="3 9" transform="rotate(35)"/>
  <ellipse rx="90" ry="90" fill="none" stroke="#4a4d55" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></ellipse>
  <circle r="46" fill="url(#g)"/>
  <text y="14" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="800" font-size="40" fill="#161616">PJ</text>
  <g transform="rotate(-20)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(130 0)"><circle r="16" fill="#2b2d32" stroke="#f7aa02"/><text y="4" text-anchor="middle" font-size="11" font-family="Consolas" fill="#f7aa02">Java</text></g></g></g>
  <g transform="rotate(35)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    <g transform="translate(130 0)"><circle r="14" fill="#2b2d32" stroke="#ff6b4a"/><text y="4" text-anchor="middle" font-size="11" font-family="Consolas" fill="#ff6b4a">Go</text></g></g></g>
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    <g transform="translate(90 0)"><circle r="13" fill="#2b2d32" stroke="#ececec"/><text y="4" text-anchor="middle" font-size="10" font-family="Consolas" fill="#ececec">SQL</text></g></g>
</g>

<!-- text -->
<text x="50" y="95" font-family="Consolas,monospace" font-size="16" fill="#f7aa02">&lt;hello world /&gt;</text>
<text x="50" y="165" font-family="Segoe UI,Arial" font-weight="800" font-size="62" fill="#ececec">Piyush <tspan fill="url(#g)">Joshi</tspan></text>
<text x="50" y="205" font-family="Consolas,monospace" font-size="19" fill="#9a9ca3">Java Backend Developer · System Engineer @ TCS</text>
<g font-family="Consolas,monospace" font-size="13">
  <rect x="50" y="232" width="110" height="30" rx="15" fill="none" stroke="#f7aa02"><animate attributeName="stroke-opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></rect>
  <text x="105" y="252" text-anchor="middle" fill="#f7aa02">Spring Boot</text>
  <rect x="172" y="232" width="70" height="30" rx="15" fill="none" stroke="#f7aa02"><animate attributeName="stroke-opacity" values="1;.4;1" dur="3s" begin="-1s" repeatCount="indefinite"/></rect>
  <text x="207" y="252" text-anchor="middle" fill="#f7aa02">Docker</text>
  <rect x="254" y="232" width="150" height="30" rx="15" fill="#f7aa02"/>
  <text x="329" y="252" text-anchor="middle" fill="#161616" font-weight="700">13 hackathon wins</text>
</g>
</svg>
